<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEEF1">
<title>Mapas del viaje a Japón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap">
<style>
:root{
  --bg:#ECEEF1;--ink:#15171C;--ink-2:#4B505C;--ink-3:#7D828E;--line:rgba(20,24,32,.09);
  --glass:rgba(255,255,255,.72);--lime:#C8F23A;--lime-d:#8DBA06;--blue:#1638FF;--blue-2:#2A4BFF;
  --f:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f);-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(120% 70% at 50% 0%,#F6F7F9,#E7E9ED 70%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:10px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 10px 34px rgba(30,36,50,.10)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* cabecera */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-left));}
.logo{white-space:nowrap;display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;text-decoration:none;padding:8px 14px;border-radius:999px}
.logo b{color:#E0393E;font-family:'Hiragino Mincho ProN','Yu Mincho',serif}
.seg{display:flex;gap:2px;padding:4px;border-radius:999px;margin:0 auto}
.seg button{padding:8px 18px;border-radius:999px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button[aria-current="true"]{background:var(--ink);color:#fff}
.go3d{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-weight:700;text-decoration:none;white-space:nowrap}
@media (max-width:640px){.logo span{display:none}.seg button{padding:8px 12px;font-size:14px}.go3d span{display:none}.go3d{padding:9px 11px}}

/* vista de mapa */
.view{position:relative;max-width:1720px;margin:0 auto;padding:0 16px 28px}
.hero{position:relative;z-index:5;padding:6px 8px 0;max-width:520px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13.5px;color:var(--ink-3);margin-bottom:6px}
.crumbs button{color:var(--ink-2);font-weight:600}.crumbs button:hover{color:var(--ink)}
.hero h1{margin:0;font-weight:700;font-size:clamp(28px,4vw,46px);line-height:1.05;letter-spacing:-.02em;display:flex;align-items:center;gap:14px}
.hero h1::before{content:"";width:5px;align-self:stretch;border-radius:3px;background:var(--lime)}
.hero p{margin:8px 0 0 19px;color:var(--ink-2);font-size:16px}
.stage{position:relative;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-radius:20px}
.stage::-webkit-scrollbar{display:none}
.frame{position:relative;width:100%;margin:0 auto;aspect-ratio:1672/941}
.frame img.map{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-mask-image:radial-gradient(ellipse 70% 68% at 50% 50%,#000 68%,transparent 100%);mask-image:radial-gradient(ellipse 70% 68% at 50% 50%,#000 68%,transparent 100%);user-select:none;-webkit-user-drag:none;transition:opacity .35s}
.frame img.map.loading{opacity:.35}
.frame svg.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.route path.glow{stroke:var(--lime);stroke-width:12;opacity:.35;filter:blur(3px)}
.route path.under{stroke:#fff;stroke-width:7}
.route path.line{stroke:var(--lime);stroke-width:4;stroke-dasharray:1 0}
.route path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.route path.line.draw{animation:draw 1.6s ease forwards}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.pins{position:absolute;inset:0}
.pin{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--ink);font-weight:800;font-size:14px;box-shadow:0 0 0 4px var(--lime),0 6px 16px rgba(0,0,0,.25);transition:transform .2s}
.pin:hover{transform:translate(-50%,-50%) scale(1.1)}
.pin[aria-pressed="true"]{background:var(--ink);color:#fff;transform:translate(-50%,-50%) scale(1.18)}
.pin .lb{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);font-size:12.5px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.12);pointer-events:none}
.bub{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:6px}
.bub span{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:rgba(40,44,52,.72);color:#fff;font-weight:600;font-size:15px;white-space:nowrap;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 6px 16px rgba(0,0,0,.2);transition:background .2s}
.bub i{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px var(--lime),0 4px 10px rgba(0,0,0,.25)}
.bub:hover span,.bub[aria-pressed="true"] span{background:var(--ink)}
.bub[aria-pressed="true"] i{background:var(--lime);box-shadow:0 0 0 4px #fff,0 4px 10px rgba(0,0,0,.25)}

/* paneles */
.itin{position:relative;z-index:6;margin-top:14px;overflow:auto;border-radius:24px;padding:18px 14px 14px;scrollbar-width:thin}
.itin h2,.card h2{margin:0;font-weight:700}
.itin h2{font-size:20px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}
.itin ol{list-style:none;margin:0;padding:0;position:relative}
.itin ol::before{content:"";position:absolute;left:17px;top:18px;bottom:18px;width:2px;background:var(--line)}
.it{position:relative;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;padding:8px 6px;border-radius:16px}
.it:hover,.it[aria-pressed="true"]{background:rgba(255,255,255,.75)}
.it .dt{position:relative;z-index:1;width:14px;height:14px;margin-left:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(200,242,58,.3)}
.it b{display:block;font-weight:600;font-size:14.5px;line-height:1.25}
.it small{display:block;color:var(--ink-3);font-size:12.5px}
.it img{width:56px;height:42px;border-radius:10px;object-fit:cover}
.card{position:relative;z-index:6;margin-top:14px;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 16px 44px rgba(30,36,50,.18)}
.card .ph{position:relative;height:250px;background:#dde1e6}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 42%)}
.card .ph h2{position:absolute;z-index:1;left:20px;right:20px;top:16px;color:#fff;font-size:26px;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.card .ph .k{position:absolute;z-index:1;left:20px;top:auto;bottom:14px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.88);font-size:12.5px;font-weight:700}
.blue{background:var(--blue);color:#fff;padding:18px 20px 20px}
.blue .t{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px}
.blue p{margin:8px 0 0;color:rgba(255,255,255,.86);font-size:14px}
.stats{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}
.stats div{display:flex;align-items:center;gap:8px;font-size:15px}
.stats div+div{padding-left:16px;border-left:1px solid rgba(255,255,255,.25)}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:16px;padding:13px;border-radius:999px;background:#fff;color:var(--blue);font-weight:700;font-size:16px;text-decoration:none}
.cta+.cta{margin-top:8px;background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.kids{position:relative;z-index:6;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.kid{display:flex;align-items:center;gap:14px;padding:8px 14px 8px 8px;border-radius:22px;min-height:96px;text-align:left}
.kid img{width:120px;height:76px;border-radius:16px;object-fit:cover;flex:none}
.kid b{display:block;font-weight:600;font-size:17px;line-height:1.2}
.kid small{display:block;color:var(--ink-3);font-size:13px;margin-top:2px}
.kid .ch{margin-left:auto;width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.kid:hover .ch{background:var(--lime)}
.kidsh{margin:26px 4px 10px;font-weight:700;font-size:18px;position:relative;z-index:6}

/* galerías */
.gal{max-width:1400px;margin:0 auto;padding:8px 16px 40px}
.gal h1{margin:10px 4px 4px;font-size:clamp(28px,4vw,42px);letter-spacing:-.02em}
.gal>p{margin:0 4px 18px;color:var(--ink-2)}
.gal h3{margin:26px 4px 10px;font-size:18px;display:flex;gap:10px;align-items:baseline}
.gal h3 small{color:var(--ink-3);font-weight:500;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gc{border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 8px 26px rgba(30,36,50,.08);text-align:left;transition:transform .2s}
.gc:hover{transform:translateY(-3px)}
.gc img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#dde1e6}
.gc div{padding:12px 16px 14px}
.gc b{display:block;font-size:17px;font-weight:650}
.gc small{color:var(--ink-3);font-size:13px}

@media (min-width:1181px){
  .view{display:grid;grid-template-columns:290px minmax(0,1fr) 330px;column-gap:20px;align-items:start;max-width:min(1720px,calc((100vh - 230px)/0.664 + 680px))}
  .hero{grid-column:1/-1;max-width:none}
  .stage{grid-column:2;grid-row:2;overflow:visible;margin-top:0}
  .frame{width:118%;margin-left:-9%}
  .panels{display:contents}
  .itin{grid-column:1;grid-row:2;margin-top:10px;max-height:calc((100vw - 680px)*.664)}
  .card{grid-column:3;grid-row:2;margin-top:10px}
  .kidsh,.kids,.hint{grid-column:1/-1}
}
@media (max-width:1180px){.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.panels .card{order:-1}}
@media (max-width:760px){
  .frame{width:175%}
  .panels{grid-template-columns:1fr}
  .card .ph{height:200px}
  .pin{width:30px;height:30px;font-size:13px}
  .pin .lb{display:none}
  .bub span{font-size:13px;padding:6px 11px}
  .kid img{width:110px;height:66px}
  .hint{display:block}
}
.hint{display:none;text-align:center;color:var(--ink-3);font-size:12.5px;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function places(id){

/* curva suave por puntos (Catmull-Rom) */
function curve(pts){
  if(pts.length<2)return '';
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;

}

}

  let n=0;
  const pinH=pl.map((p,i)=>{n++;const v=p.visits;return `<button type="button" class="pin" style="left:${p.x}%;top:${p.y}%" data-sel="p${i}" aria-label="${esc(p.n)}, ${esc(dayTxt([...new Set(v.map(s=>s.d))]))}">${n}<span class="lb">${esc(p.n)}</span></button>`}).join('');
  const bubH=ks.map(k=>{const xy=M[k].xy;return `<button type="button" class="bub" style="left:${xy[0]}%;top:${xy[1]}%" data-go="${k}" data-sel="k${k}"><span>${esc(M[k].n)}</span><i></i></button>`}).join('');
  // itinerario
  let rows='';
  if(pl.length){pl.forEach((p,i)=>{const v=p.visits,d0=v[0];rows+=`<li><button type="button" class="it" data-sel="p${i}"><span class="dt"></span><span><b>${d0.t?esc(d0.t)+' · ':''}${esc(p.n)}</b><small>${esc(dayTxt([...new Set(v.map(s=>s.d))]))} · ${esc(DAYS[d0.d].date)}${v.length>1?' · '+v.length+' veces':''}</small></span>${p.img?`<img src="${foto(p.img)}" alt="" loading="lazy">`:''}</button></li>`})}
  ks.forEach(k=>{const kd=daysIn(k);rows+=`<li><button type="button" class="it" data-go="${k}" data-sel="k${k}"><span class="dt"></span><span><b>${esc(M[k].n)}</b><small>${esc(dayTxt(kd))}${kd.length?' · '+esc(dateTxt(kd)):''}</small></span><img src="${th(k)}" alt="" loading="lazy"></button></li>`});
  const list=[...ks.map(k=>({k})),...(sib.length?sib.map(k=>({k})):[])];
  const kidsList=(ks.length?ks:sib);
  const kidsTitle=ks.length?(id==='V01'?'Las etapas':'Los barrios'):'Otros barrios de '+M[m.p].n;
  return `<section class="view">
   <div class="hero"><nav class="crumbs" aria-label="Dónde estás">${chain.map((k,i)=>i<chain.length-1?`<button type="button" data-go="${k}">${esc(M[k].n)}</button>${ic('chev')}`:'').join('')}</nav>
    <h1>${esc(m.n)}</h1><p>${esc(m.s)}</p></div>
   <div class="stage" id="stage"><div class="frame">
     <img class="map loading" src="${big(id)}" alt="Mapa ilustrado: ${esc(m.n)}" onload="this.classList.remove('loading')">
     <svg class="route" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${routeSvg}</svg>
     <div class="pins">${bubH}${pinH}</div>
   </div></div>
   <p class="hint">Desliza el mapa hacia los lados · toca un número</p>
   <div class="panels">
     ${rows?`<aside class="itin glass"><h2>${id==='V01'?'Tu viaje':'Tu itinerario'}<span title="${esc(dateTxt(ds))}">${ic('cal')}</span></h2><ol>${rows}</ol></aside>`:''}
     <aside class="card" id="card" aria-live="polite"></aside>
   </div>
   ${kidsList.length?`<h2 class="kidsh">${esc(kidsTitle)}</h2><div class="kids">${kidsList.map(k=>{const kd=daysIn(k);return `<button type="button" class="kid glass" data-go="${k}"><img src="${th(k)}" alt="" loading="lazy"><span><b>${esc(M[k].n)}</b><small>${esc(dayTxt(kd)||M[k].s)}</small></span><span class="ch">${ic('chev')}</span></button>`}).join('')}</div>`:''}
  </section>`;
}
function cardFor(id,sel){
  const m=M[id],pl=places(id);
  let ph,title,k,txt,ds,ns,btns='';
  if(sel&&sel[0]==='p'){
    const p=pl[+sel.slice(1)];ds=[...new Set(p.visits.map(s=>s.d))];
    ph=p.img?foto(p.img):th(id);title=p.n;k=p.visits[0].t?p.visits[0].t+' · '+DAYS[ds[0]].date:DAYS[ds[0]].date;
    txt=p.note||DAYS[ds[0]].t;
    btns=ds.slice(0,2).map((d,i)=>`<a class="cta" href="../#dia-${d}">${i?'':''}Ver el día ${d} en 3D ${ic('arrow')}</a>`).join('');
    return render(ph,title,k,'torii',DAYS[ds[0]].t,txt,[[ic('cal'),dayTxt(ds)],[ic('pin'),p.visits.length>1?p.visits.length+' visitas':'1 visita']],btns);
  }
  const kk=sel&&sel[0]==='k'?sel.slice(1):null;
  const tgt=kk||id;ds=daysIn(tgt);ns=new Set(stopsIn(tgt).map(s=>s.n)).size;
  ph=th(tgt);title=M[tgt].n;k=dateTxt(ds);txt=M[tgt].s;
  if(kk)btns=`<button type="button" class="cta" data-go="${kk}">Abrir el mapa ${ic('arrow')}</button>`;
  if(ds.length)btns+=`<a class="cta" href="../#dia-${ds[0]}">Ver en 3D ${ic('cube')}</a>`;
  return render(ph,title,k,'route',kk?'Mapa de '+M[kk].n:(id==='V01'?'Ruta del viaje':'Ruta por '+m.n),txt,[[ic('route'),ns+' parada'+(ns===1?'':'s')],[ic('cal'),ds.length+' día'+(ds.length===1?'':'s')]],btns);
  function render(ph,title,k,ico,head,txt,stats,btns){
    return `<div class="ph"><img src="${ph}" alt=""><h2>${esc(title)}</h2>${k?`<span class="k">${esc(k)}</span>`:''}</div>
    <div class="blue"><div class="t">${ic(ico)}${esc(head)}</div>${txt&&txt!==head?`<p>${esc(txt)}</p>`:''}
    <div class="stats">${stats.map(s=>`<div>${s[0]}${esc(s[1])}</div>`).join('')}</div>${btns}</div>`;
  }
}
function centerOn(x){requestAnimationFrame(()=>{const st=$('#stage');if(st&&st.scrollWidth>st.clientWidth+4)st.scrollTo({left:st.scrollWidth*x/100-st.clientWidth/2,behavior:'smooth'})})}
function select(sel){
  SEL=sel;const id=CUR;
  document.querySelectorAll('[data-sel]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sel===sel)));
  const c=$('#card');if(c)c.innerHTML=cardFor(id,sel);
}
function gallery(kind){
  if(kind==='ciudades'){
    const cs=kids('V01');
    return `<section class="gal"><h1>Ciudades</h1><p>Toca una para ver sus barrios y lo que vais a ver.</p><div class="grid">${cs.map(k=>{const d=daysIn(k);return `<button type="button" class="gc" data-go="${k}"><img src="${th(k)}" alt="" loading="lazy"><div><b>${esc(M[k].n)}</b><small>${esc(dayTxt(d))} · ${esc(dateTxt(d))}</small></div></button>`}).join('')}</div></section>`;
  }
  return `<section class="gal"><h1>Barrios</h1><p>Los 26 sitios del viaje, por ciudad.</p>${kids('V01').map(c=>{const bs=kids(c);if(!bs.length)return '';return `<h3>${esc(M[c].n)}<small>${esc(dateTxt(daysIn(c)))}</small></h3><div class="grid">${bs.map(k=>{const d=daysIn(k);return `<button type="button" class="gc" data-go="${k}"><img src="${th(k)}" alt="" loading="lazy"><div><b>${esc(M[k].n)}</b><small>${esc(dayTxt(d))} · ${esc(M[k].s)}</small></div></button>`}).join('')}</div>`}).join('')}</section>`;
}
let CUR='V01';
function render(){
  let h=decodeURIComponent(location.hash.slice(1))||'V01';
  const dm=h.match(/^dia-(\d+)$/);
  if(dm){const cnt={};S.filter(s=>s.d===+dm[1]&&s.m).forEach(s=>{const c=s.m[0]==='B'?M[s.m].p:s.m;cnt[c]=(cnt[c]||0)+1});
    const best=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||'V01';history.replaceState(null,'','#'+best);h=best}
  const tab=h==='ciudades'||h==='barrios'?h:'mapa';
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.tab===tab)));
  if(tab!=='mapa'){$('#app').innerHTML=gallery(tab);scrollTo(0,0);return}
  CUR=M[h]?h:'V01';
  $('#app').innerHTML=mapView(CUR);
  const ds=daysIn(CUR);$('#go3d').href='../'+(ds.length?'#dia-'+ds[0]:'');
  document.title=M[CUR].n+' · Mapas de Japón';
  const pl=places(CUR),ks=kids(CUR);
  select(CUR[0]==='B'&&pl.length?'p0':null);
  // animación de la ruta
  document.querySelectorAll('.route path.line').forEach(p=>{try{const L=p.getTotalLength();p.style.setProperty('--len',L);p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.classList.add('draw')}catch(e){}});
  const xs=[...pl.map(p=>p.x),...ks.map(k=>M[k].xy[0])];centerOn(xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:50);
  scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  const s=e.target.closest('[data-sel]');
  if(s&&s.classList.contains('pin')){select(s.dataset.sel);if(innerWidth<=1180){const c=$('#card');c&&c.scrollIntoView({behavior:'smooth',block:'nearest'})}return}
  if(s&&s.classList.contains('it')&&!g){select(s.dataset.sel);const pin=document.querySelector('.pin[data-sel="'+s.dataset.sel+'"]');if(pin){centerOn(parseFloat(pin.style.left));if(innerWidth<=1180)$('#stage').scrollIntoView({behavior:'smooth',block:'center'})}return}
  if(g){e.preventDefault();location.hash=g.dataset.go;return}
});
document.addEventListener('mouseover',e=>{const b=e.target.closest('.bub');if(b&&SEL!==b.dataset.sel&&innerWidth>1180)select(b.dataset.sel)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const p=M[CUR]&&M[CUR].p;if(p&&location.hash.slice(1)===CUR)location.hash=p}});
addEventListener('hashchange',render);
render();
})();
</script>
</body>
</html>
